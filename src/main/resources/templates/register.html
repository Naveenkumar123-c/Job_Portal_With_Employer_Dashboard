<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Job Portal - Register</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background: #f4f6f9;
        }

        .register-container {

            width: 430px;

            background: white;

            padding: 35px;

            border-radius: 12px;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.12);
        }

        h1 {

            text-align: center;

            color: #1f2937;

            margin-bottom: 10px;
        }

        .subtitle {

            text-align: center;

            color: #6b7280;

            margin-bottom: 25px;
        }

        .form-group {

            margin-bottom: 18px;
        }

        label {

            display: block;

            margin-bottom: 7px;

            color: #374151;

            font-weight: bold;
        }

        input,
        select {

            width: 100%;

            padding: 12px;

            border: 1px solid #cbd5e1;

            border-radius: 6px;

            font-size: 15px;
        }

        input:focus,
        select:focus {

            outline: none;

            border-color: #2563eb;
        }

        button {

            width: 100%;

            padding: 12px;

            border: none;

            border-radius: 6px;

            background: #2563eb;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        button:hover {

            background: #1d4ed8;
        }

        .login-link {

            text-align: center;

            margin-top: 20px;

            color: #6b7280;
        }

        .login-link a {

            color: #2563eb;

            text-decoration: none;

            font-weight: bold;
        }

        .login-link a:hover {

            text-decoration: underline;
        }

    </style>

</head>

<body>

<div class="register-container">

    <h1>
        Job Portal
    </h1>

    <p class="subtitle">
        Create your account
    </p>

    <form action="/register"
          method="POST">

        <div class="form-group">

            <label for="name">
                Full Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your full name"
                required>

        </div>

        <div class="form-group">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required>

        </div>

        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required>

        </div>

        <div class="form-group">

            <label for="role">
                Role
            </label>

            <select
                id="role"
                name="role"
                required>

                <option value="">
                    Select Role
                </option>

                <option value="candidate">
                    Candidate
                </option>

                <option value="employer">
                    Employer
                </option>

            </select>

        </div>

        <button type="submit">
            Register
        </button>

    </form>

    <div class="login-link">

        Already have an account?

        <a href="/index.html">
            Login
        </a>

    </div>

</div>

</body>

</html>
