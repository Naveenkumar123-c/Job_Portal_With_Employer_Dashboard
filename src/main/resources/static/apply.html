<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Apply for Job</title>

    <link rel="stylesheet" href="apply.css">
</head>

<body>

<div class="sidebar">

    <h2>Job Portal</h2>

    <a href="candidate-dashboard.html">
        Dashboard
    </a>

    <a href="jobs.html">
        Browse Jobs
    </a>

    <a href="my-applications.html">
        My Applications
    </a>

    <a href="logout">
        Logout
    </a>

</div>


<div class="main-content">

    <h1>Apply for Job</h1>

    <div id="jobDetails">
        Loading job details...
    </div>

    <form id="applicationForm">

        <label>Full Name</label>

        <input
            type="text"
            id="applicantName"
            required>


        <label>Email</label>

        <input
            type="email"
            id="email"
            required>


        <label>Experience</label>

        <input
            type="text"
            id="experience"
            placeholder="e.g. 2 years"
            required>


        <label>Cover Letter</label>

        <textarea
            id="coverLetter"
            rows="8"
            placeholder="Tell the employer why you are suitable for this job">
        </textarea>


        <button type="submit">
            Submit Application
        </button>

        <p id="message"></p>

    </form>

</div>


<script>

const urlParams =
    new URLSearchParams(window.location.search);

const jobId =
    urlParams.get("jobId");


let selectedJob = null;


document.addEventListener(
    "DOMContentLoaded",
    function () {

        if (!jobId) {

            document.getElementById(
                "jobDetails"
            ).innerHTML =
                "<p>Job ID is missing.</p>";

            return;

        }

        loadJob();

        loadCandidate();

    }
);


function loadJob() {

    fetch("/api/jobs/" + jobId)

        .then(response => {

            if (!response.ok) {
                throw new Error("Job not found");
            }

            return response.json();

        })

        .then(job => {

            selectedJob = job;

            document.getElementById(
                "jobDetails"
            ).innerHTML = `

                <h2>
                    ${job.title || "Job"}
                </h2>

                <p>
                    <strong>Company:</strong>
                    ${job.company || "Not specified"}
                </p>

                <p>
                    <strong>Location:</strong>
                    ${job.location || "Not specified"}
                </p>

                <p>
                    <strong>Job Type:</strong>
                    ${job.type || "Not specified"}
                </p>

                <p>
                    <strong>Salary:</strong>
                    ${job.salary || "Not specified"}
                </p>

                <p>
                    <strong>Skills:</strong>
                    ${job.skills || "Not specified"}
                </p>

                <p>
                    <strong>Description:</strong>
                    ${job.description || "No description"}
                </p>

                <hr>

            `;

        })

        .catch(error => {

            console.error(error);

            document.getElementById(
                "jobDetails"
            ).innerHTML =
                "<p>Unable to load job details.</p>";

        });

}


function loadCandidate() {

    fetch("/api/candidate-profile/me")

        .then(response => {

            if (!response.ok) {
                return null;
            }

            return response.json();

        })

        .then(profile => {

            if (!profile) {
                return;
            }

            const nameInput =
                document.getElementById(
                    "applicantName"
                );

            const emailInput =
                document.getElementById(
                    "email"
                );

            if (profile.name) {
                nameInput.value =
                    profile.name;
            }

            if (profile.email) {
                emailInput.value =
                    profile.email;
            }

        })

        .catch(error => {

            console.error(
                "Candidate profile error:",
                error
            );

        });

}


document
    .getElementById("applicationForm")
    .addEventListener(
        "submit",
        function (event) {

            event.preventDefault();


            if (!selectedJob) {

                document.getElementById(
                    "message"
                ).textContent =
                    "Job details are not loaded.";

                return;

            }


            const application = {

                applicantName:
                    document.getElementById(
                        "applicantName"
                    ).value.trim(),

                email:
                    document.getElementById(
                        "email"
                    ).value.trim(),

                jobTitle:
                    selectedJob.title,

                experience:
                    document.getElementById(
                        "experience"
                    ).value.trim(),

                coverLetter:
                    document.getElementById(
                        "coverLetter"
                    ).value.trim(),

                status:
                    "Pending"

            };


            const message =
                document.getElementById(
                    "message"
                );


            message.textContent =
                "Submitting application...";


            fetch("/api/applications", {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify(application)

            })

            .then(response => {

                if (!response.ok) {
                    throw new Error(
                        "Application failed"
                    );
                }

                return response.json();

            })

            .then(result => {

                message.textContent =
                    "Application submitted successfully!";


                setTimeout(function () {

                    window.location.href = "my-applications.html";

                }, 1000);

            })

            .catch(error => {

                console.error(error);

                message.textContent =
                    "Unable to submit application.";

            });

        }
    );

</script>

</body>

</html>
