<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Post Job</title>

    <link rel="stylesheet" href="dashboard.css">
</head>

<body>

<div class="sidebar">

    <h2>Job Portal</h2>

    <a href="employer-dashboard.html">
        Dashboard
    </a>

    <a href="post-job.html" class="active">
        Post Job
    </a>

    <a href="my-jobs.html">
        My Jobs
    </a>

    <a href="applications.html">
        Applications
    </a>

    <a href="profile.html">
        Profile
    </a>

    <a href="index.html">
        Logout
    </a>

</div>


<div class="main-content">

    <h1>Post a New Job</h1>

    <p>Create a job vacancy for candidates.</p>


    <form id="jobForm">

        <div>
            <label>Job Title</label>

            <input
                type="text"
                id="title"
                name="title"
                placeholder="Java Developer"
                required>
        </div>


        <div>
            <label>Company</label>

            <input
                type="text"
                id="company"
                name="company"
                placeholder="Company name"
                required>
        </div>


        <div>
            <label>Location</label>

            <input
                type="text"
                id="location"
                name="location"
                placeholder="Chennai"
                required>
        </div>


        <div>
            <label>Job Type</label>

            <select id="type" name="type" required>

                <option value="">
                    Select Job Type
                </option>

                <option value="Full Time">
                    Full Time
                </option>

                <option value="Part Time">
                    Part Time
                </option>

                <option value="Internship">
                    Internship
                </option>

                <option value="Contract">
                    Contract
                </option>

            </select>

        </div>


        <div>
            <label>Salary</label>

            <input
                type="text"
                id="salary"
                name="salary"
                placeholder="?5 LPA">
        </div>


        <div>
            <label>Skills</label>

            <input
                type="text"
                id="skills"
                name="skills"
                placeholder="Java, Spring Boot, MySQL">
        </div>


        <div>
            <label>Job Description</label>

            <textarea
                id="description"
                name="description"
                rows="8"
                placeholder="Enter job description"
                required></textarea>
        </div>


        <button type="submit">
            Post Job
        </button>

        <p id="message"></p>

    </form>

</div>


<script>

document
    .getElementById("jobForm")
    .addEventListener("submit", function(event) {

        event.preventDefault();


        const job = {

            title:
                document.getElementById("title").value.trim(),

            company:
                document.getElementById("company").value.trim(),

            location:
                document.getElementById("location").value.trim(),

            type:
                document.getElementById("type").value,

            salary:
                document.getElementById("salary").value.trim(),

            skills:
                document.getElementById("skills").value.trim(),

            description:
                document.getElementById("description").value.trim()

        };


        const message =
            document.getElementById("message");


        message.textContent = "Posting job...";


        fetch("/api/jobs", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify(job)

        })

        .then(response => {

            if (!response.ok) {
                throw new Error("Failed to post job");
            }

            return response.json();

        })

        .then(savedJob => {

            message.textContent =
                "Job posted successfully!";


            document
                .getElementById("jobForm")
                .reset();


            setTimeout(function() {

                window.location.href =
                    "my-jobs.html";

            }, 1000);

        })

        .catch(error => {

            console.error(error);

            message.textContent =
                "Unable to post job.";

        });

    });

</script>

</body>

</html>
