<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Profile - Job Portal</title>

    <link rel="stylesheet" href="profile.css">

</head>

<body>


    <!-- =========================
         Sidebar
         ========================= -->

    <div class="sidebar">

        <h2>Job Portal</h2>

        <a href="employer-dashboard.html">
            Dashboard
        </a>

        <a href="post-job.html">
            Post Job
        </a>

        <a href="my-jobs.html">
            My Jobs
        </a>

        <a href="applications.html">
            Applications
        </a>

        <a
            href="profile.html"
            class="active">

            Profile

        </a>

        <a href="index.html">
            Logout
        </a>

    </div>


    <!-- =========================
         Main Content
         ========================= -->

    <div class="main-content">


        <!-- Page Header -->

        <div class="page-header">

            <h1>
                My Profile
            </h1>

            <p>
                Manage your profile information.
            </p>

        </div>


        <!-- =========================
             Profile Card
             ========================= -->

        <div class="profile-card">


            <div class="profile-card-header">

                <div class="profile-avatar">
                    👤
                </div>

                <div>

                    <h2>
                        Profile Information
                    </h2>

                    <p>
                        Keep your employer information
                        up to date.
                    </p>

                </div>

            </div>


            <!-- =========================
                 Profile Form
                 ========================= -->

            <form id="profileForm">


                <!-- Full Name -->

                <div class="profile-form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                        required>

                </div>


                <!-- Email -->

                <div class="profile-form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required>

                </div>


                <!-- Company -->

                <div class="profile-form-group">

                    <label for="company">
                        Company Name
                    </label>

                    <input
                        type="text"
                        id="company"
                        placeholder="Enter your company name"
                        required>

                </div>


                <!-- Phone -->

                <div class="profile-form-group">

                    <label for="phone">
                        Phone
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter phone number"
                        required>

                </div>


                <!-- Qualification -->

                <div class="profile-form-group">

                    <label for="qualification">
                        Qualification
                    </label>

                    <input
                        type="text"
                        id="qualification"
                        placeholder="Enter your qualification"
                        required>

                </div>


                <!-- Skills -->

                <div class="profile-form-group">

                    <label for="skills">
                        Skills
                    </label>

                    <textarea
                        id="skills"
                        rows="5"
                        placeholder="Java, HTML, CSS, JavaScript, etc."
                        required></textarea>

                </div>


                <!-- Resume -->

                <div class="profile-form-group">

                    <label for="resume">
                        Resume
                    </label>

                    <div class="file-upload">

                        <input
                            type="file"
                            id="resume"
                            accept=".pdf,.doc,.docx">

                        <p>
                            Accepted formats:
                            PDF, DOC, DOCX
                        </p>

                    </div>

                </div>


                <!-- Save Button -->

                <button
                    type="submit"
                    class="save-profile-btn">

                    Save Profile

                </button>


                <!-- Message -->

                <p
                    id="message"
                    class="profile-message">
                </p>


            </form>

        </div>

    </div>


    <!-- =========================
         Existing JavaScript
         ========================= -->

    <script src="/profile.js?v=2"></script>

</body>

</html>
