<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Job Portal - Login</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #f4f6f9;
        }

        .login-container {

            width: 400px;

            background: white;

            padding: 35px;

            border-radius: 12px;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.12);
        }

        h1 {

            text-align: center;

            color: #1f2937;

            margin-bottom: 10px;
        }

        .subtitle {

            text-align: center;

            color: #6b7280;

            margin-bottom: 25px;
        }

        .form-group {

            margin-bottom: 20px;
        }

        label {

            display: block;

            margin-bottom: 7px;

            color: #374151;

            font-weight: bold;
        }

        input,
        select {

            width: 100%;

            padding: 12px;

            border: 1px solid #cbd5e1;

            border-radius: 6px;

            font-size: 15px;
        }

        input:focus,
        select:focus {

            outline: none;

            border-color: #2563eb;
        }

        button {

            width: 100%;

            padding: 12px;

            border: none;

            border-radius: 6px;

            background: #2563eb;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        button:hover {

            background: #1d4ed8;
        }

        .register {

            text-align: center;

            margin-top: 20px;

            color: #6b7280;
        }

        .register a {

            color: #2563eb;

            text-decoration: none;

            font-weight: bold;
        }

        .register a:hover {

            text-decoration: underline;
        }

        .message {

            background: #dcfce7;

            color: #166534;

            padding: 10px;

            border-radius: 6px;

            text-align: center;

            margin-bottom: 15px;
        }

        .error {

            background: #fee2e2;

            color: #b91c1c;

            padding: 10px;

            border-radius: 6px;

            text-align: center;

            margin-bottom: 15px;
        }

    </style>

</head>

<body>

<div class="login-container">

    <h1>Job Portal</h1>

    <p class="subtitle">
        Login to your account
    </p>

    <div id="message"
         class="message"
         style="display:none;">
    </div>

    <div id="error"
         class="error"
         style="display:none;">
    </div>

    <form action="/login"
          method="POST">

        <div class="form-group">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required>

        </div>

        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required>

        </div>

        <div class="form-group">

            <label for="role">
                Role
            </label>

            <select
                id="role"
                name="role"
                required>

                <option value="">
                    Select Role
                </option>

                <option value="candidate">
                    Candidate
                </option>

                <option value="employer">
                    Employer
                </option>

            </select>

        </div>

        <button type="submit">
            Login
        </button>

    </form>

    <div class="register">

        Don't have an account?

        <a href="/register.html">
            Register
        </a>

    </div>

</div>

<script>

    const params =
        new URLSearchParams(
            window.location.search
        );

    const message =
        params.get("message");

    const error =
        params.get("error");

    if (message) {

        const messageBox =
            document.getElementById("message");

        messageBox.textContent =
            message;

        messageBox.style.display =
            "block";
    }

    if (error) {

        const errorBox =
            document.getElementById("error");

        errorBox.textContent =
            error;

        errorBox.style.display =
            "block";
    }

</script>

</body>

</html>
